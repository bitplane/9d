name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch pinned dependencies
        run: make deps
      - name: Test
        run: |
          make check-warnings
          make check-sanitizers
      - name: Build complete source archive
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: Verify offline source archive
        run: |
          version=${GITHUB_REF_NAME#v}
          work=$(mktemp -d)
          tar -C "$work" -xf "dist/9d-$version.tar.xz"
          test ! -e "$work/9d-$version/libixp/.git"
          make -C "$work/9d-$version" release
      - name: Create release and upload sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes
          sh scripts/aros/upload.sh "$GITHUB_REF_NAME" dist/*
      - name: Export source release
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  binaries:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04
            toolbox: ""
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            toolbox: ""
          - target: i386-aros
            runner: ubuntu-24.04
            toolbox: aros/2026-08-31/i386:v0.1.1
          - target: aarch64-aros
            runner: ubuntu-24.04
            toolbox: aros/2026-08-31/aarch64:v0.1.1
          - target: x86_64-aros
            runner: ubuntu-24.04
            toolbox: aros/2026-08-31/x86_64:v0.1.8
          - target: x86_64-netbsd
            runner: ubuntu-24.04
            toolbox: netbsd/10.0/x86_64:v0.1.1
          - target: aarch64-netbsd
            runner: ubuntu-24.04
            toolbox: netbsd/10.0/aarch64:v0.1.1
          - target: x86_64-illumos
            runner: ubuntu-24.04
            toolbox: illumos/2026-08-13/x86_64:v0.1.1
          - target: x86_64-haiku
            runner: ubuntu-24.04
            toolbox: haiku/r1-beta6-hrev59919-1/x86_64:v0.1.1
          - target: aarch64-haiku
            runner: ubuntu-24.04
            toolbox: haiku/r1-beta6-hrev59919-1/aarch64:v0.1.1
          - target: arm-riscos
            runner: ubuntu-24.04
            toolbox: riscos/7800:v0.1.7
          - target: x86_64-darwin
            runner: ubuntu-24.04
            toolbox: puredarwin/17.4/x86_64:v0.1.1
    uses: ./.github/workflows/release-target.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      toolbox: ${{ matrix.toolbox }}
    secrets:
      AROS_PKG_KEY: ${{ secrets.AROS_PKG_KEY }}
